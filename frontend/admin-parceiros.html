<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#2329c5">
  <title>Cadastro de parceiros | DM</title>
  <link rel="stylesheet" href="css/parceiro.css">
  <link rel="stylesheet" href="css/admin-parceiros.css">
</head>
<body>
  <header class="topbar">
    <a class="marca" href="index.html" aria-label="DM — voltar para o início">
      <span class="marca__logo">dm<span>.</span></span>
      <span class="marca__divisor" aria-hidden="true"></span>
      <span class="marca__nome">Administração de parceiros</span>
    </a>
    <a class="voltar" href="index.html">Voltar ao início <span aria-hidden="true">↗</span></a>
  </header>

  <div class="pagina pagina--admin">
    <aside class="apresentacao"><h1>Cadastro de parceiros</h1><p>Ambiente acadêmico. Acesso administrativo necessário.</p></aside>

    <main class="painel-principal painel-principal--admin">
      

      <div class="campo">
        <label for="token-admin">Chave de acesso administrativo</label>
        <input id="token-admin" type="password" autocomplete="off" required placeholder="Informe sua chave de acesso">
      </div>

      <form id="programa-form">
        <div class="admin-grid">
          <div class="campo"><label for="rede-nome">Nova rede</label><input id="rede-nome" maxlength="120"></div>
          <div class="campo"><label for="rede-id">Rede existente</label><select id="rede-id"><option value="">Criar nova rede</option></select></div>
          <div class="campo"><label for="programa-nome">Nome do cartão</label><input id="programa-nome" required maxlength="120"></div>
          <div class="campo"><label for="programa-modalidade">Modalidade</label><select id="programa-modalidade"><option value="LOJA_FISICA">Física</option><option value="LOJA_DIGITAL">Digital</option></select></div>
        </div>
        <button type="submit" class="btn-primario">Cadastrar programa</button>
      </form>
      <form id="vinculo-form">
        <div class="admin-grid">
          <div class="campo"><label for="unidade-existente">ID da unidade existente</label><input id="unidade-existente" name="loja_id" type="number" min="1" required></div>
          <div class="campo"><label for="programa-existente">Adicionar programa</label><select id="programa-existente" name="programa_id"><option value="">Somente coordenadas</option></select></div>
          <div class="campo"><label for="lat-existente">Latitude</label><input id="lat-existente" name="latitude" type="number" step="any" min="-90" max="90"></div>
          <div class="campo"><label for="lon-existente">Longitude</label><input id="lon-existente" name="longitude" type="number" step="any" min="-180" max="180"></div>
        </div>
        <button class="btn-primario" type="submit">Atualizar unidade</button>
      </form>
      <form id="loja-form">
        <div class="admin-grid">
          <div class="campo admin-grid__completo">
            <label for="loja-nome">Nome do estabelecimento</label>
            <input id="loja-nome" name="nome" required minlength="3" maxlength="120" placeholder="Ex.: Loja Parceira Centro">
          </div>
          <div class="campo">
            <label for="loja-estado">Estado</label>
            <select id="loja-estado" name="estado" required>
              <option value="">Selecione o estado</option>
              <option>AC</option><option>AL</option><option>AP</option><option>AM</option><option>BA</option><option>CE</option><option>DF</option><option>ES</option><option>GO</option><option>MA</option><option>MT</option><option>MS</option><option>MG</option><option>PA</option><option>PB</option><option>PR</option><option>PE</option><option>PI</option><option>RJ</option><option>RN</option><option>RS</option><option>RO</option><option>RR</option><option>SC</option><option>SP</option><option>SE</option><option>TO</option>
            </select>
          </div>
          <div class="campo">
            <label for="loja-cidade">Cidade</label>
            <input id="loja-cidade" name="cidade" required minlength="2" maxlength="100" placeholder="Cidade">
          </div>
          <div class="campo admin-grid__completo">
            <label for="loja-endereco">Endereço</label>
            <input id="loja-endereco" name="endereco" required minlength="5" maxlength="180" placeholder="Rua, número e bairro">
          </div>
          <div class="campo">
            <label for="loja-cep">CEP</label>
            <input id="loja-cep" name="cep" required inputmode="numeric" maxlength="9" placeholder="00000-000">
          </div>
          <div class="campo admin-grid__completo"><label for="loja-programa">Programa de cartão (opcional)</label><select id="loja-programa" name="programa_id"><option value="">Loja independente</option></select><button id="carregar-programas" type="button" class="btn-primario">Atualizar programas</button></div>
          <div class="campo"><label for="latitude">Latitude (opcional)</label><input id="latitude" name="latitude" type="number" step="any" min="-90" max="90"></div>
          <div class="campo"><label for="longitude">Longitude (opcional)</label><input id="longitude" name="longitude" type="number" step="any" min="-180" max="180"></div>
          <label class="admin-checkbox"><input type="checkbox" name="emite_cartao_credito"><span>Esta loja emite cartão de crédito</span></label>
        </div>
        <button type="submit" class="btn-primario" id="cadastrar-loja">Cadastrar loja <span aria-hidden="true">→</span></button>
      </form>

      <div id="loja-criada" class="registro-ok" role="status" aria-live="polite" hidden></div>

      <section id="acesso-parceiro" class="acesso-parceiro" aria-labelledby="acesso-titulo" hidden>
        <h2 id="acesso-titulo">Criar acesso da loja</h2>
        <form id="conta-form">
          <div class="campo">
            <label for="conta-email">E-mail do responsável</label>
            <input id="conta-email" type="email" autocomplete="off" required placeholder="responsavel@loja.com">
          </div>
          <div class="campo">
            <label for="conta-senha">Senha inicial</label>
            <input id="conta-senha" type="password" minlength="8" autocomplete="new-password" required placeholder="Pelo menos 8 caracteres">
          </div>
          <button type="submit" class="btn-primario" id="cadastrar-conta">Criar acesso <span aria-hidden="true">→</span></button>
        </form>
      </section>

      <div id="admin-mensagem" class="mensagem" role="status" aria-live="polite"></div>
    </main>
  </div>

  <script src="js/admin-parceiros.js"></script>
</body>
</html>
