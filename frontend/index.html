<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DM - Landing Page de Captação</title>
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/header.css">
  <link rel="stylesheet" href="css/hero.css">
  <link rel="stylesheet" href="css/beneficios.css">
  <link rel="stylesheet" href="css/prova-social.css">
  <link rel="stylesheet" href="css/formulario.css">
  <link rel="stylesheet" href="css/footer.css">
</head>
<body>

  <header id="header" class="header">
    <div class="header__logo">DM</div>
    <button class="header__cta" id="btn-solicitar-cartao">Solicitar cartão</button>
  </header>

  <main>

    <section id="hero" class="hero">

    </section>

    <section id="beneficios" class="beneficios">

    </section>


    <section id="prova-social" class="prova-social">

    </section>


    <section id="formulario" class="formulario">

      <div id="stepper" class="stepper"></div>


      <div id="passo-1" class="passo" data-passo="1">

      </div>


      <div id="passo-2" class="passo" data-passo="2" hidden>

      </div>


      <div id="passo-3" class="passo" data-passo="3" hidden>

      </div>

    </section>

  </main>


  <footer id="footer" class="footer">

  </footer>


  <script src="js/stepper.js"></script>
  <script src="js/passo1-escolha-cartao.js"></script>
  <script src="js/passo2-formulario.js"></script>
  <script src="js/passo3-resultado.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
