name: Validacao

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: sqlite:///./test_ci.sqlite
      AUTH_SECRET: segredo-local-apenas-para-testes-1234567890123456
      COLABORADORES_DM: "{}"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -q

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --test frontend/tests/*.test.mjs
      - run: |
          for arquivo in frontend/js/*.js; do
            node --check "$arquivo"
          done

  integracao-mysql:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: teste_ci
          MYSQL_DATABASE: dmcard_ci
          MYSQL_USER: dmcard_ci
          MYSQL_PASSWORD: teste_ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -udmcard_ci -pteste_ci"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      DATABASE_URL: mysql+pymysql://dmcard_ci:teste_ci@127.0.0.1:3306/dmcard_ci
      AUTH_SECRET: segredo-local-apenas-para-testes-1234567890123456
      ADMIN_TOKEN: token-administrativo-teste-1234567890123456
      COLABORADORES_DM: "{}"
      CEP_API_BASE_URL: http://127.0.0.1:8765/ws
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: python -m pip install -r backend/requirements-dev.txt
      - name: Instalar biblioteca de mapas
        run: |
          npm install --prefix /tmp/mapa --no-save --ignore-scripts leaflet@1.9.4
          mkdir -p frontend/vendor/leaflet
          cp -r /tmp/mapa/node_modules/leaflet/dist/. frontend/vendor/leaflet/
      - name: Iniciar serviços de teste
        run: |
          python backend/tests/cep_simulado.py > /tmp/cep.log 2>&1 &
          (cd backend && python -m uvicorn app.main:app --host 127.0.0.1 --port 8000 > /tmp/api.log 2>&1) &
          python -m http.server 5173 --bind 127.0.0.1 --directory frontend > /tmp/web.log 2>&1 &
          for tentativa in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/health; then exit 0; fi
            sleep 2
          done
          cat /tmp/api.log
          exit 1
      - run: npm install --no-save playwright
      - run: npx playwright install --with-deps chromium
      - run: node frontend/tests/jornada-mysql.mjs
      - name: Diagnóstico da integração
        if: failure()
        run: cat /tmp/api.log /tmp/cep.log /tmp/web.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: demonstracao-academica
          path: |
            demonstracao/
            /tmp/api.log
          if-no-files-found: warn

  docker-compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configurar ambiente descartável
        run: |
          cp .env.example .env
          sed -i "s/^AUTH_SECRET=.*/AUTH_SECRET=$(openssl rand -hex 32)/" .env
          sed -i "s/^ADMIN_TOKEN=.*/ADMIN_TOKEN=$(openssl rand -hex 32)/" .env
      - name: Subir imagens reais
        run: docker compose up --build -d --wait --wait-timeout 180
      - name: Verificar API pelo frontend
        run: |
          curl --fail --silent --show-error http://localhost:5173/vendor/leaflet/leaflet.js -o /tmp/leaflet.js
          test -s /tmp/leaflet.js
          curl --fail --silent --show-error http://localhost:5173/js/api-config.js | grep -F '"/api"'
          curl --fail --silent --show-error http://localhost:5173/api/cartoes/ | python -c 'import json,sys; assert {c["tipo"] for c in json.load(sys.stdin)} == {"DM","LOJA_FISICA","LOJA_DIGITAL"}'
          curl --fail --silent --show-error http://localhost:8000/cartoes/ | python -c 'import json,sys; assert len(json.load(sys.stdin)) == 3'
      - name: Testar entrega SMTP no Mailpit
        run: |
          docker compose exec -T backend python - <<'PY'
          from app.main import app
          from app.controllers import application_controller
          from app.schemas.application import ApplicationCreate
          from app.database import SessionLocal
          application_controller.obter_uf_por_cep = lambda cep: "SP"
          from app.models.partner_store import PartnerStore
          with SessionLocal() as db:
              loja = next(l for l in db.query(PartnerStore).all() if l.modalidade == "LOJA_DIGITAL")
              dados = ApplicationCreate(nome="Pessoa Teste", cpf="32376226643", email="teste-mailpit@example.com", telefone="12999998888", cep="12210000", tipo_cartao="LOJA_DIGITAL", loja_id=loja.id, aceita_ofertas=True)
              resposta = application_controller.criar_solicitacao(dados, db)
              assert resposta["status"] == "REPROVADO", resposta
              assert resposta["situacao_oferta"] == "AGUARDANDO_CONFIRMACAO", resposta
          PY
          python - <<'PY'
          import json, urllib.request
          base = "http://127.0.0.1:8025"
          with urllib.request.urlopen(base + "/api/v1/messages") as r:
              mensagens = json.load(r)["messages"]
          assert len(mensagens) == 1, mensagens
          assert mensagens[0]["To"][0]["Address"] == "teste-mailpit@example.com"
          with urllib.request.urlopen(base + "/api/v1/message/" + mensagens[0]["ID"]) as r:
              mensagem = json.load(r)
          assert "DMCred" in mensagem["Text"] and "Empréstimo pessoal" in mensagem["Text"]
          import re
          link = re.search(r"http://localhost:5173/api/ofertas/confirmar\?token=\S+", mensagem["Text"]).group()
          with urllib.request.urlopen(link) as r:
              assert "Interesse confirmado" in r.read().decode()
          print("E-mail recebido no Mailpit e interesse confirmado.")
          PY
      - name: Diagnóstico
        if: always()
        run: |
          docker compose ps
          docker compose logs --tail=80
          docker compose down -v
