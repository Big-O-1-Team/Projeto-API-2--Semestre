services:
  mysql:
    image: mysql:8.4
    container_name: dmcard_mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-dmcard}
      MYSQL_USER: ${MYSQL_USER:-dmcard_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-dmcard123}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysql --protocol=TCP -h 127.0.0.1 -u\"$$MYSQL_USER\" -p\"$$MYSQL_PASSWORD\" \"$$MYSQL_DATABASE\" -e 'SELECT 1'"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    container_name: dmcard_backend
    restart: unless-stopped
    environment:
      DATABASE_URL: mysql+pymysql://${MYSQL_USER:-dmcard_user}:${MYSQL_PASSWORD:-dmcard123}@mysql:3306/${MYSQL_DATABASE:-dmcard}
      COLABORADORES_DM: '${COLABORADORES_DM}'
      AUTH_SECRET: '${AUTH_SECRET}'
      ADMIN_TOKEN: '${ADMIN_TOKEN}'
      RATE_LIMIT_POR_MINUTO: '${RATE_LIMIT_POR_MINUTO:-120}'
      SMTP_HOST: '${SMTP_HOST:-}'
      SMTP_PORT: '${SMTP_PORT:-587}'
      SMTP_USER: '${SMTP_USER:-}'
      SMTP_PASSWORD: '${SMTP_PASSWORD:-}'
      SMTP_FROM: '${SMTP_FROM:-}'
      PUBLIC_API_URL: '${PUBLIC_API_URL:-}'
      DEMO_PRE_QUALIFICACAO: '${DEMO_PRE_QUALIFICACAO:-0}'
      PRE_QUALIFICADOS_FICTICIOS: '${PRE_QUALIFICADOS_FICTICIOS:-}'
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/cartoes/', timeout=5).read()"]
      interval: 5s
      timeout: 8s
      retries: 20
      start_period: 10s
    volumes:
      - ./backend:/app
    depends_on:
      mysql:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    container_name: dmcard_frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
    depends_on:
      backend:
        condition: service_healthy

volumes:
  mysql_data:
